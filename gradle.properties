## Mod Properties

mod_id=tarkov_selfinteract_fix
mod_name=TarkovCraft Self-Interaction Crash Fix
# No upstream license applies (this is new, standalone code, not a fork) - MIT.
mod_license=MIT
mod_version=1.0.0
mod_group_id=dev.malik.tarkovselffix

# TarkovCraft: Core - version actually deployed (mods folder). Its entity interaction API
# (EntityInteraction.Context) throws "Player and target cannot be the same entity" whenever the
# player is passed as their own target, and none of its four call sites checks for that first.
# Verified via javap against the real deployed jar - see specification/SPEC.md.
# Resolved from Modrinth's maven by version id (6JVxqmLW = 2.11.2+1.21.1), compile + dev runtime only.
tarkovcraft_core_version=2.11.2
tarkovcraft_core_modrinth_version=6JVxqmLW
# Configuration 3.1.1 (Toma), required by TarkovCraft Core at runtime - dev runs/GameTests only.
configuration_modrinth_version=6Mztfq1u

