plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
    id 'me.modmuss50.mod-publish-plugin' version '2.2.1'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    // TarkovCraft Core + its Configuration library: no maven of their own, Modrinth's maven by version id.
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

base {
    archivesName = mod_id
}

// GameTests (src/gametest) - loaded by the dev runs only, never part of the released jar.
sourceSets {
    gametest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // Runs all GameTests of this mod against the real TarkovCraft Core jar, then exits.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gametest)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // TarkovCraft Core: compiled against to target the real classes the mixins patch, and on the dev
    // runtime so the GameTests run against it. Never shipped - mods.toml hard-requires it instead.
    implementation("maven.modrinth:tarkovcraft-core:${tarkovcraft_core_modrinth_version}") { transitive = false }
    localRuntime("maven.modrinth:configuration:${configuration_modrinth_version}") { transitive = false }

    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version        : minecraft_version,
            minecraft_version_range  : minecraft_version_range,
            neo_version              : neo_version,
            tarkovcraft_core_version : tarkovcraft_core_version,
            loader_version_range     : loader_version_range,
            mod_id                   : mod_id,
            mod_name                 : mod_name,
            mod_license              : mod_license,
            mod_version              : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Release notes of this version: its own section of CHANGELOG.md, from "## [<mod_version>]" up to the next
// "## [" heading. A release without one fails instead of going out with empty or wrong notes.
def changelogSection = providers.provider {
    def lines = file('CHANGELOG.md').readLines('UTF-8')
    int start = lines.findIndexOf { it.trim() == "## [${mod_version}]" }
    if (start < 0) {
        throw new GradleException("CHANGELOG.md has no '## [${mod_version}]' section - add one before releasing")
    }
    int end = lines.findIndexOf(start + 1) { it.startsWith('## [') }
    def body = lines.subList(start + 1, end < 0 ? lines.size() : end).join('\n').trim()
    if (body.isEmpty()) {
        throw new GradleException("The '## [${mod_version}]' section of CHANGELOG.md is empty")
    }
    "## [${mod_version}]\n\n${body}"
}

// Upload to CurseForge + GitHub release, run by .github/workflows/release.yml on a version tag. Without
// CURSEFORGE_API_KEY (e.g. on a dev machine) it's always a dry run: the upload is only written to build/publishMods.
publishMods {
    file = jar.archiveFile
    changelog = changelogSection
    version = mod_version
    type = STABLE
    displayName = "${mod_id}-${mod_version}"
    modLoaders.add('neoforge')
    dryRun = providers.environmentVariable('CURSEFORGE_API_KEY').getOrNull() == null

    curseforge {
        // Empty until the CurseForge project exists - release.yml refuses to publish while it is.
        projectId = providers.gradleProperty('curseforge_project_id').map { it.trim() }
        accessToken = providers.environmentVariable('CURSEFORGE_API_KEY')
        minecraftVersions.add(minecraft_version)
        client = true
        server = true
        requires('tarkovcraft-core')
    }
    github {
        accessToken = providers.environmentVariable('GITHUB_TOKEN')
        repository = project.github_repository
        commitish = providers.environmentVariable('GITHUB_SHA').orElse('main')
        tagName = "v${mod_version}"
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
